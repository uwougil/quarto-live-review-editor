<!doctype html>
<meta charset="utf-8">
<title>Quarto Live Review long-document browser harness</title>
<link rel="stylesheet" href="../media/webview-editor-theme.css">
<link rel="stylesheet" href="../media/katex.min.css">
<style>
	:root {
		--vscode-editor-background: #ffffff;
		--vscode-editor-foreground: #202124;
		--vscode-editor-font-family: Arial, sans-serif;
		--vscode-editor-font-size: 15px;
		--vscode-editorCursor-foreground: #1358d4;
		--vscode-textCodeBlock-background: #f1f3f5;
		--vscode-panel-border: #d0d7de;
	}
	html, body { height: 100%; overflow: hidden; }
	#mlp-root { width: 100%; height: 100%; }
	.cm-editor { height: 100%; }
</style>
<div id="mlp-root"></div>
<script>
	const testParams = new URLSearchParams(location.search);
	window.__MLP_ENABLE_TEST_HOOKS__ = true;
	window.__MLP_DISABLE_VIEWPORT_PARSE_FOR_TEST__ = testParams.get('baseline') === '1';
	window.__mlpPostedMessages = [];
	window.acquireVsCodeApi = () => ({
		postMessage(message) { window.__mlpPostedMessages.push(message); },
		getState() { return null; },
		setState() {},
	});
</script>
<script>
	const longTaskEntries = [];
	let longTaskObserver = null;
	if (window.PerformanceObserver) {
		try {
			longTaskObserver = new PerformanceObserver((list) => {
				for (const entry of list.getEntries()) longTaskEntries.push(entry.duration);
			});
			longTaskObserver.observe({ type: 'longtask', buffered: true });
		} catch (_) {
			longTaskObserver = null;
		}
	}
</script>
<script>
	const bundlePath = testParams.get('bundle') || '../dist/webview-editor.js';
	document.write(`<script src="${bundlePath}"><\/script>`);
</script>
<script>
	function buildRealisticFixture() {
		const lines = ['---', 'title: "Long scientific document fixture"', 'format: html', 'jupyter: python3', '---', ''];
		const longSentence = 'This deliberately long logical line contains wrapping text, inline mathematics $\\Omega_n(\\mathbf{k}) = -2\\operatorname{Im}\\langle \\partial_{k_x}u_n \\mid \\partial_{k_y}u_n \\rangle$, a [cross-reference](#sec-method), an HTML anchor <a id="fixture-anchor"></a>, Unicode 中文、 日本語、β and a small image ![atom](data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=). ';
		for (let section = 1; section <= 24; section++) {
			lines.push(`## Section ${section}: symmetry, topology and transport`, `<a id="sec-${section}"></a>`);
			for (let paragraph = 1; paragraph <= 18; paragraph++) {
				let line = `${section}.${paragraph} ` + longSentence.repeat(3 + (paragraph % 2));
				if (paragraph % 6 === 0) line += ` The measured response remains finite near the ${paragraph}th sampling point, and the conclusion is recorded for later reference.`;
				lines.push(line);
				if (paragraph % 9 === 0) lines.push('$$', '\\sigma_{xy} = -\\frac{e^2}{\\hbar}\\sum_n\\int_{\\mathrm{BZ}} \\frac{d^3 k}{(2\\pi)^3} f_{n\\mathbf{k}} \\Omega_{n,z}(\\mathbf{k}) .', '$$');
			}
			lines.push('| quantity | value | uncertainty |', '|:--|--:|--:|', `| Section ${section} | ${section * 3.14} | ${0.01 * section} |`);
			if (section % 4 === 0) {
				lines.push('```{python}', `value_${section} = ${section}  # Quarto executable-cell syntax`, '```', '');
				lines.push('```mermaid', 'flowchart LR', `A${section}[输入] --> B${section}[输出]`, '```', '');
			}
		}
		lines.push('', '## References', '[1]: https://example.org/reference', '文献 [1] 与脚注[^note] 用于检查引用附近的导航。', '', '[^note]: 这是一个脚注回归标记。', '## End of fixture', 'EOF-MARKER');
		const markerLines = new Map();
		for (const marker of ['25', '50', '75', '90', '99']) {
			const index = Math.floor(lines.length * Number(marker) / 100);
			lines[index] = `BROWSER-MARKER-${marker} ` + lines[index];
			markerLines.set(marker, index + 1);
		}
		return { text: lines.join('\n'), markerLines: Object.fromEntries(markerLines) };
	}

	function buildBenchmarkFixture(lineCount) {
		const lines = ['# Browser benchmark', ''];
		for (let line = 1; line <= lineCount - 4; line++) {
			lines.push(line % 100 === 0
				? `benchmark line ${line}: **bold** $x_${line}$ [link](#browser-benchmark) 中文 β.`
				: `benchmark line ${line}: ordinary wrapped text 中文 β.`);
		}
		lines.push('', 'EOF-MARKER');
		return { text: lines.join('\n'), markerLines: {} };
	}

	function buildInlineFixture() {
		const image = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
		const inline = [
			'INLINE-REVEAL-START ordinary prose',
			'**bold-one**',
			'**bold-two**',
			'*italic-one*',
			'_italic-two_',
			'~~strike-one~~',
			'~~strike-two~~',
			'`code-one`',
			'`code-two`',
			'[link-one](#target-one)',
			'[link-two](#target-two)',
			`![image-one](${image})`,
			'A[^15]',
			'B[^16]',
			'C[^17]',
			'D[^18]',
			'E[^19]',
			'$M_s$',
			'ordinary prose before the long wrapping tail',
		].join(' ');
		const wrappingTail = 'ordinary words keep this one logical Markdown line soft-wrapped across many visual CodeMirror rows. '.repeat(18);
		return [
			`${inline} ${wrappingTail}INLINE-REVEAL-END.`,
			'',
			'[^15]: First inline footnote definition.',
			'[^16]: Second inline footnote definition.',
			'[^17]: Third inline footnote definition.',
			'[^18]: Fourth inline footnote definition.',
			'[^19]: Fifth inline footnote definition.',
		].join('\n');
	}

	function buildInteractionFixture() {
		const plainSentence = 'The target paragraph uses plain text and enough ordinary words to force one logical source line across many visual rows without any inline syntax changing its width. ';
		const revealSentence = 'The source-reveal target contains **emphasis**, [a link](https://example.org), inline math $M_s$, and footnote [^1], plus enough ordinary words to force many visual rows. ';
		const targetLine = (marker, sentence = plainSentence) => `${marker} ${sentence.repeat(10)}${marker.replace('-START', '-END')}.`;
		const filler = (name, count) => Array.from({ length: count }, (_, index) => `${name} filler paragraph ${index + 1} keeps the target at a controlled document depth with ordinary wrapped text.`);
		const lines = [
			'# Geometry depth interaction fixture',
			'',
			'Short paragraph before the first target.',
			'',
			targetLine('TARGET-TOP-START'),
			'',
			'FOLLOWING-TOP-START short paragraph after the top target.',
			'',
			...filler('DEPTH-25', 8),
			'',
			targetLine('TARGET-25-START'),
			'',
			'FOLLOWING-25-START short paragraph after the 25 percent target.',
			'',
			...filler('DEPTH-50', 8),
			'',
			targetLine('TARGET-50-START', revealSentence),
			'',
			'FOLLOWING-50-START short paragraph after the source-reveal target.',
			'',
			...filler('DEPTH-75', 8),
			'',
			targetLine('TARGET-75-START'),
			'',
			'FOLLOWING-75-START short paragraph after the 75 percent target.',
			'',
			'Other content appears before the final target.',
			'~~~~python',
			'value = 42',
			'~~~~',
			'',
			'| kind | value |',
			'|:--|--:|',
			'| block widget fixture | 1 |',
			'',
			targetLine('TARGET-EOF-START'),
		].join('\n');
		return lines;
	}

	function buildFootnoteInteractionFixture() {
		const lead = 'FOOTNOTE-INTERACTION-START This realistic scientific paragraph keeps ordinary prose before the reference cluster and deliberately wraps as one logical line. ';
		const beforeCluster = 'The discussion of Berry curvature, symmetry constraints, and antiferromagnetic spintronics advances in a carefully documented direction until it reaches the next ';
		const afterCluster = 'Here we present the reproducible measurements and the interpretation that follows the consecutive references. ';
		const tail = 'The remaining context stays ordinary and editable while the rendered references preserve the source structure during keyboard navigation. '.repeat(14);
		const paragraph = `${lead}${beforeCluster}spintronics[^1][^2][^3][^4]${afterCluster}${tail} First occurrence[^same] is separated from the second occurrence[^same] to verify exact duplicate navigation. FOOTNOTE-INTERACTION-END.`;
		const dragLine = 'DRAG-START plain alpha before **bold words** and *italic words*, then `inline code`, [rendered link](https://example.org/issue-26), inline math $x^2$, and prose before footnote[^drag] followed by DRAG-END plain omega.';
		const verticalPadding = '0123456789 '.repeat(10);
		const softWrapped = 'SOFT-WRAP-START ' + 'ordinary wrapped prose keeps the pointer and caret on real visual rows. '.repeat(5) + 'before soft footnote[^soft] after it ' + 'more wrapped prose follows the rendered reference. '.repeat(5) + 'SOFT-WRAP-END.';
		return [
			paragraph,
			'',
			dragLine,
			`VERTICAL-TOP ${verticalPadding}`,
			'VERTICAL-FOOTNOTE-ROW keeps the rendered cluster at a measurable horizontal position [^v1][^v2] and has trailing prose.',
			`VERTICAL-BOTTOM ${verticalPadding}`,
			softWrapped,
			'',
			'[^1]: First interaction-test footnote definition.',
			'[^2]: Second interaction-test footnote definition.',
			'[^3]: Third interaction-test footnote definition.',
			'[^4]: Fourth interaction-test footnote definition.',
			'[^same]: Shared duplicate-occurrence footnote definition.',
			'[^drag]: Drag interaction footnote definition.',
			'[^soft]: Soft-wrapped interaction footnote definition.',
			'[^v1]: First vertical-target footnote definition.',
			'[^v2]: Second vertical-target footnote definition.',
			'[^last]: Last-line hit-testing footnote definition.',
			'',
			'LAST-LINE-FOOTNOTE-PROSE editable text ends immediately before the final reference[^last]',
		].join('\n');
	}

	function buildFootnoteCaretFixture() {
		const references = Array.from({ length: 36 }, (_, index) => `[^r${index}]`).join('');
		const body = `FOOTNOTE-CARET-START ${'ordinary words '.repeat(18)}before ${references} after ${'ordinary words '.repeat(30)}FOOTNOTE-CARET-END.`;
		const definitions = Array.from({ length: 36 }, (_, index) => `[^r${index}]: Caret geometry definition ${index}.`);
		return [body, '', ...definitions].join('\n');
	}

	function buildFootnoteCaretNegativeFixture() {
		const body = `FOOTNOTE-CARET-NEGATIVE-START ${'ordinary words '.repeat(18)}ordinary proseX[^1] after ${'ordinary words '.repeat(30)}FOOTNOTE-CARET-NEGATIVE-END.`;
		return [body, '', '[^1]: Negative caret geometry definition.'].join('\n');
	}

	function buildTypewriterFixture() {
		const sentence = 'This long writing line keeps enough ordinary prose to make the caret position and viewport movement measurable in a real CodeMirror editor. ';
		return Array.from({ length: 180 }, (_, index) => `TYPEWRITER-${String(index + 1).padStart(3, '0')} ${sentence.repeat(2)}`).join('\n');
	}

	function buildArrowScrollFixture() {
		const wrapped = 'ordinary wrapped words keep the logical source line long enough to cross several visual rows while the caret moves one row at a time. '.repeat(16);
		const lines = [
			'# Arrow scroll fixture',
			'',
			'ARROW-TOP-START document-start paragraph.',
			'',
			...Array.from({ length: 24 }, (_, index) => `ARROW-PREFIX-${index + 1} ordinary content keeps the middle cases away from the document top.`),
			'',
			'## Wrapped paragraph',
			`ARROW-WRAPPED-START ${wrapped}ARROW-WRAPPED-END.`,
			'',
			'> ARROW-BLOCKQUOTE-START quoted content remains editable while the viewport follows the caret.',
			'> The second blockquote line provides a real line boundary for vertical movement.',
			'',
			'- ARROW-LIST-START list content remains source-safe during navigation.',
			'- The second list item provides another ordinary line boundary.',
			'',
			'```{python}',
			'ARROW-CODE-START value = 42',
			'for item in range(12):',
			'    print(item)',
			'ARROW-CODE-END',
			'```',
			'',
			`ARROW-FOOTNOTE-START ${wrapped.slice(0, 330)} before [^one][^two][^three] after the rendered cluster.`,
			'',
			...Array.from({ length: 30 }, (_, index) => `ARROW-FILLER-${index + 1} ordinary content keeps the document long enough to exercise viewport edges.`),
			'',
			'ARROW-EOF-START document-end paragraph.',
			'',
			'[^one]: First arrow-scroll footnote.',
			'[^two]: Second arrow-scroll footnote.',
			'[^three]: Third arrow-scroll footnote.',
		];
		return lines.join('\n');
	}

	async function loadSource() {
		if (testParams.get('inline') === '1') return { text: buildInlineFixture(), kind: 'inline-geometry' };
		if (testParams.get('interaction') === '1') return { text: buildInteractionFixture(), kind: 'interaction-geometry' };
		if (testParams.get('footnoteInteraction') === '1') return { text: buildFootnoteInteractionFixture(), kind: 'footnote-interaction' };
		if (testParams.get('footnoteCaret') === '1') return { text: buildFootnoteCaretFixture(), kind: 'footnote-caret' };
		if (testParams.get('footnoteCaretNegative') === '1') return { text: buildFootnoteCaretNegativeFixture(), kind: 'footnote-caret-negative' };
		if (testParams.get('typewriter') === '1') return { text: buildTypewriterFixture(), kind: 'typewriter' };
		if (testParams.get('arrowScroll') === '1') return { text: buildArrowScrollFixture(), kind: 'arrow-scroll' };
		const benchmarkLines = Number(testParams.get('lines'));
		if (Number.isInteger(benchmarkLines) && benchmarkLines >= 10) return { ...buildBenchmarkFixture(benchmarkLines), kind: `benchmark-${benchmarkLines}` };
		const sourcePath = testParams.get('source');
		if (!sourcePath) return { text: buildRealisticFixture().text, kind: 'synthetic' };
		const response = await fetch('/' + sourcePath.replace(/^\/+/, ''));
		if (!response.ok) throw new Error(`source fetch failed: ${response.status}`);
		return { text: await response.text(), kind: 'repository-source' };
	}

	async function setCursorForTest(pos) {
		window.dispatchEvent(new MessageEvent('message', { data: { type: 'setCursor', pos } }));
		await sleep(120);
	}

	function inlineLineSnapshot(anchor) {
		const line = [...document.querySelectorAll('.cm-line')].find((candidate) => candidate.textContent?.includes(anchor));
		if (!line) return null;
		const rect = line.getBoundingClientRect();
		const contentRange = document.createRange();
		contentRange.selectNodeContents(line);
		const visualRows = [];
		for (const fragment of [...contentRange.getClientRects()].filter((candidate) => candidate.width > 1 && candidate.height > 1)) {
			if (!visualRows.some((top) => Math.abs(top - fragment.top) <= 1)) visualRows.push(fragment.top);
		}
		const internalImages = [...line.querySelectorAll('img')].map((image) => {
			const style = getComputedStyle(image);
			const imageRect = image.getBoundingClientRect();
			return {
				className: image.className,
				display: style.display,
				marginTop: style.marginTop,
				marginBottom: style.marginBottom,
				width: style.width,
				height: style.height,
				rectHeight: imageRect.height,
			};
		});
		const links = [...line.querySelectorAll('a.mlp-link')].map((link) => link.getAttribute('data-href'));
		return { text: line.textContent, top: rect.top, height: rect.height, visualRows: visualRows.length, html: line.innerHTML.slice(0, 800), internalImages, links };
	}

	async function runInlineGeometry() {
		const text = buildInlineFixture();
		const tokens = {
			boldOne: '**bold-one**',
			boldTwo: '**bold-two**',
			italicOne: '*italic-one*',
			italicTwo: '_italic-two_',
			strikeOne: '~~strike-one~~',
			strikeTwo: '~~strike-two~~',
			codeOne: '`code-one`',
			codeTwo: '`code-two`',
			linkOne: '[link-one](#target-one)',
			linkTwo: '[link-two](#target-two)',
			imageOne: '![image-one](data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=)',
			footnote15: '[^15]',
			footnote16: '[^16]',
			footnote17: '[^17]',
			footnote18: '[^18]',
			footnote19: '[^19]',
			math: '$M_s$',
		};
		const items = [
			{ name: 'ordinary', pos: text.indexOf('ordinary prose') + 2 },
			{ name: 'boldOne', pos: text.indexOf(tokens.boldOne) + 3 },
			{ name: 'boldTwo', pos: text.indexOf(tokens.boldTwo) + 3 },
			{ name: 'italicOne', pos: text.indexOf(tokens.italicOne) + 2 },
			{ name: 'italicTwo', pos: text.indexOf(tokens.italicTwo) + 2 },
			{ name: 'strikeOne', pos: text.indexOf(tokens.strikeOne) + 3 },
			{ name: 'strikeTwo', pos: text.indexOf(tokens.strikeTwo) + 3 },
			{ name: 'codeOne', pos: text.indexOf(tokens.codeOne) + 2 },
			{ name: 'codeTwo', pos: text.indexOf(tokens.codeTwo) + 2 },
			{ name: 'linkOne', pos: text.indexOf(tokens.linkOne) + 2 },
			{ name: 'linkTwo', pos: text.indexOf(tokens.linkTwo) + 2 },
			{ name: 'imageOne', pos: text.indexOf(tokens.imageOne) + 2 },
			{ name: 'footnote15', pos: text.indexOf(tokens.footnote15) + 2 },
			{ name: 'footnote16', pos: text.indexOf(tokens.footnote16) + 2 },
			{ name: 'footnote17', pos: text.indexOf(tokens.footnote17) + 2 },
			{ name: 'footnote18', pos: text.indexOf(tokens.footnote18) + 2 },
			{ name: 'footnote19', pos: text.indexOf(tokens.footnote19) + 2 },
			{ name: 'math', pos: text.indexOf(tokens.math) + 2 },
		];
		dispatchInit(text, await loadThemeCss());
		await waitFor(() => snapshot()?.docLength === text.length, 2500);
		const rendered = [];
		const source = [];
		const revealChecks = [];
		const lineAnchor = 'INLINE-REVEAL-START';
		for (const item of items) {
			await setCursorForTest(items[0].pos);
			const renderedGeometry = inlineLineSnapshot(lineAnchor);
			rendered.push({ name: item.name, geometry: renderedGeometry });
			await setCursorForTest(item.pos);
			const sourceGeometry = inlineLineSnapshot(lineAnchor);
			source.push({ name: item.name, geometry: sourceGeometry });
			const sourceText = sourceGeometry?.text || '';
			const presence = Object.fromEntries(Object.entries(tokens).map(([name, token]) => [name, sourceText.includes(token)]));
			const activeOnly = Object.entries(presence).every(([name, present]) => present === (name === item.name));
			revealChecks.push({ name: item.name, position: item.pos, presence, activeOnly, visualRows: sourceGeometry?.visualRows ?? 0 });
		}
		await setCursorForTest(items[0].pos);
		const allWidgetBuffers = [...document.querySelectorAll('.cm-widgetBuffer')].map((image) => {
			const style = getComputedStyle(image);
			const rect = image.getBoundingClientRect();
			return { display: style.display, marginTop: style.marginTop, marginBottom: style.marginBottom, width: style.width, height: style.height, rectHeight: rect.height, parentText: image.parentElement?.textContent };
		});
		const renderedFootnotes = [...document.querySelectorAll('.mlp-footnote-ref')].map((button) => button.textContent);
		const firstReferenceFrom = text.indexOf('[^15]');
		const firstDefinitionFrom = text.indexOf('[^15]:');
		const firstReference = document.querySelector('.mlp-footnote-ref');
		let navigation = { referenceCount: renderedFootnotes.length, toDefinition: null, backToReference: null };
		if (firstReference instanceof HTMLElement) {
			firstReference.click();
			await sleep(80);
			navigation.toDefinition = window.__mlpDebugSelection?.();
			const back = document.querySelector('.mlp-footnote-back');
			if (back instanceof HTMLElement) {
				back.click();
				await sleep(80);
				navigation.backToReference = window.__mlpDebugSelection?.();
			}
		}
		// A theme's generic `img` rule must not make CodeMirror's zero-width
		// widget buffers add a blank-line-sized vertical margin. Compare the same
		// line with widgets rendered and with its source syntax revealed; a small
		// natural difference is fine, but an extra line-height is a regression.
		const geometryFailures = rendered.map((item, index) => {
			const renderedHeight = item.geometry?.height ?? null;
			const sourceHeight = source[index]?.geometry?.height ?? null;
			const extraHeight = renderedHeight !== null && sourceHeight !== null ? renderedHeight - sourceHeight : null;
			return { name: item.name, renderedHeight, sourceHeight, extraHeight };
		}).filter((item) => item.renderedHeight === null || item.sourceHeight === null || item.extraHeight > 8);
		const widgetBufferFailures = allWidgetBuffers.filter((buffer) => buffer.marginTop !== '0px' || buffer.marginBottom !== '0px');
		const footnoteOk = renderedFootnotes.length === 5 &&
			navigation.toDefinition?.head === firstDefinitionFrom &&
			navigation.backToReference?.head === firstReferenceFrom;
		const renderedBaseline = rendered[0]?.geometry;
		const linkRendered = renderedBaseline?.links?.includes('#target-one') === true;
		const allRevealCasesPass = revealChecks.length === items.length && revealChecks.every((check) => check.activeOnly);
		const longLineWrapped = (renderedBaseline?.visualRows || 0) >= 5;
		return { ok: geometryFailures.length === 0 && widgetBufferFailures.length === 0 && footnoteOk && linkRendered && allRevealCasesPass && longLineWrapped, sourceKind: 'inline-geometry', sourceLength: text.length, sourceLines: text.split('\n').length, rendered, source, revealChecks, renderedFootnotes, navigation, allWidgetBuffers, geometryFailures, widgetBufferFailures, linkRendered, longLineWrapped };
	}

	async function loadThemeCss() {
		const theme = testParams.get('theme');
		if (!theme) return '';
		if (!/^[a-z0-9-]+\.css$/i.test(theme)) throw new Error('invalid theme filename');
		const response = await fetch('/media/sample-styles/' + theme);
		if (!response.ok) throw new Error(`theme fetch failed: ${response.status}`);
		return response.text();
	}

	function dispatchInit(text, css = '', typewriterMode = false) {
		window.__mlpTestSourceText = text;
		window.dispatchEvent(new MessageEvent('message', { data: {
			type: 'init', text, version: 1, css, codeTheme: 'light-plus', baseUri: location.origin + '/', dialect: 'markdown', typewriterMode,
			zoomPercent: Number(testParams.get('zoom') || 100),
		} }));
	}

	async function runTypewriterMode() {
		const source = buildTypewriterFixture();
		dispatchInit(source, '', true);
		await waitFor(() => snapshot()?.docLength === source.length, 2500);
		return { ok: Boolean(snapshot()), sourceKind: 'typewriter', sourceLength: source.length, targetMarker: 'TYPEWRITER-120' };
	}

	async function runInteractionReady() {
		const source = await loadSource();
		dispatchInit(source.text, await loadThemeCss());
		await waitFor(() => snapshot()?.docLength === source.text.length, 2500);
		await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
		return { ok: Boolean(snapshot()), baseline: false, sourceKind: source.kind, sourceLength: source.text.length, sourceLines: source.text.split('\n').length };
	}

	const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
	async function waitFor(predicate, timeoutMs = 2500, intervalMs = 25) {
		const start = performance.now();
		while (performance.now() - start < timeoutMs) {
			const value = predicate();
			if (value) return value;
			await sleep(intervalMs);
		}
		return predicate();
	}

	function snapshot() { return window.__mlpDebugSnapshot ? window.__mlpDebugSnapshot() : null; }
	function visibleDomText() { return document.querySelector('.cm-content')?.textContent ?? ''; }

	async function captureScroll(label, top) {
		const started = performance.now();
		window.__mlpDebugScrollTo(top);
		await sleep(40);
		const parsed = await waitFor(() => snapshot()?.syntaxTreeAvailableToViewport, 1600, 20);
		await sleep(30);
		return { label, requestedTop: top, parserCaughtUp: Boolean(parsed), elapsedMs: Number((performance.now() - started).toFixed(1)), snapshot: snapshot(), domTextLength: visibleDomText().length };
	}

	async function captureInteraction(label, action) {
		const before = snapshot();
		const started = performance.now();
		action();
		await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
		const after = snapshot();
		return {
			label,
			elapsedMs: Number((performance.now() - started).toFixed(1)),
			inlineRebuildDelta: (after?.decorationRebuildCount || 0) - (before?.decorationRebuildCount || 0),
			fullRebuildDelta: (after?.fullDecorationRebuildCount || 0) - (before?.fullDecorationRebuildCount || 0),
		};
	}

	async function run() {
		const started = performance.now();
		const source = await loadSource();
		const themeCss = await loadThemeCss();
		dispatchInit(source.text, themeCss);
		await waitFor(() => snapshot()?.docLength === source.text.length, 2500);
		const readyMs = Number((performance.now() - started).toFixed(1));
		const initial = snapshot();
		if (!initial) throw new Error('debug snapshot was not installed');
		const interactionPos = Math.min(Math.max(1, Math.floor(source.text.length * 0.1)), Math.max(1, source.text.length - 32));
		const interactions = [];
		interactions.push(await captureInteraction('cursor', () => window.__mlpDebugSetSelection?.(interactionPos)));
		interactions.push(await captureInteraction('selection', () => window.__mlpDebugSetSelection?.(interactionPos, Math.min(source.text.length, interactionPos + 20))));
		interactions.push(await captureInteraction('edit-insert', () => window.__mlpDebugEdit?.(interactionPos, interactionPos, 'x')));
		interactions.push(await captureInteraction('edit-revert', () => window.__mlpDebugEdit?.(interactionPos, interactionPos + 1, '')));
		const maxScroll = () => Math.max(0, (snapshot()?.scrollHeight ?? 0) - (snapshot()?.clientHeight ?? 0));
		const samples = [];
		for (const fraction of [0, 0.25, 0.5, 0.75, 0.9, 0.99]) samples.push(await captureScroll(`scroll-${fraction}`, maxScroll() * fraction));
		const eof = await captureScroll('eof', Number.MAX_SAFE_INTEGER);
		const markers = [];
		const markerTexts = source.kind === 'synthetic'
			? [['marker-25', 'BROWSER-MARKER-25', 'BROWSER-MARKER-25'], ['marker-50', 'BROWSER-MARKER-50', 'BROWSER-MARKER-50'], ['marker-75', 'BROWSER-MARKER-75', 'BROWSER-MARKER-75'], ['marker-90', 'BROWSER-MARKER-90', 'BROWSER-MARKER-90'], ['marker-99', 'BROWSER-MARKER-99', 'BROWSER-MARKER-99'], ['eof', 'EOF-MARKER', 'EOF-MARKER']]
			: [];
		for (const [label, sourceText, domText] of markerTexts) {
			const pos = source.text.indexOf(sourceText);
			if (pos < 0) { markers.push({ label, found: false }); continue; }
			window.__mlpDebugScrollToPosition(pos);
			await sleep(80);
			const current = snapshot();
			const dom = visibleDomText();
			markers.push({ label, found: true, pos, viewportContains: Boolean(current && pos >= current.viewport.from && pos <= current.viewport.to), domContainsMarker: dom.includes(domText), snapshot: current });
		}
		const finalSample = await captureScroll('final-eof', Number.MAX_SAFE_INTEGER);
		const final = finalSample.snapshot;
		const markerFailures = markers.filter((marker) => marker.found && (!marker.viewportContains || !marker.domContainsMarker));
		const ok = final && final.docLength === source.text.length && final.docLines === source.text.split('\n').length && final.scrollTop + final.clientHeight >= final.scrollHeight - 3 && final.viewport.to >= final.docLength - 2 && final.syntaxTreeAvailableToViewport && markerFailures.length === 0;
		if (longTaskObserver) longTaskObserver.disconnect();
		const longTaskTotalMs = Number(longTaskEntries.reduce((sum, duration) => sum + duration, 0).toFixed(1));
		return { ok: Boolean(ok), baseline: window.__MLP_DISABLE_VIEWPORT_PARSE_FOR_TEST__ === true, sourceKind: source.kind, sourceLength: source.text.length, sourceLines: source.text.split('\n').length, readyMs, initial, interactions, samples, eof, markers, final, markerFailures, longTaskCount: longTaskEntries.length, longTaskTotalMs };
	}

	async function runBugProbe() {
		// This is intentionally the smallest real EditorView reproduction of the
		// old implementation's failure: a display formula consumes line breaks.
		const text = '---\ntitle: probe\n---\n\n$$\n\\sigma_{xy} = -\\frac{e^2}{\\hbar}\n$$\n\n# After the formula\n\nThe tail must remain editable.';
		dispatchInit(text);
		await sleep(300);
		return { ok: true, sourceKind: 'multiline-display-math-probe', sourceLength: text.length, sourceLines: text.split('\n').length, editorPresent: Boolean(document.querySelector('.cm-editor')) };
	}

	(async () => {
		try { window.__mlpLongDocumentResult = await (testParams.get('probe') === '1' ? runBugProbe() : testParams.get('inline') === '1' ? runInlineGeometry() : testParams.get('typewriter') === '1' ? runTypewriterMode() : testParams.get('interaction') === '1' || testParams.get('footnoteInteraction') === '1' || testParams.get('footnoteCaretNegative') === '1' || testParams.get('arrowScroll') === '1' ? runInteractionReady() : run()); }
		catch (error) { window.__mlpLongDocumentResult = { ok: false, error: String(error?.stack || error) }; }
	})();
</script>
